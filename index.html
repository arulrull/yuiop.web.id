excerpt:"Dengan beberapa kebiasaan sederhana, kacamata tetap bersih, nyaman, dan lebih awet. Berikut delapan caranya.",
html:`
<p>Kacamata merupakan salah satu benda yang digunakan setiap hari untuk membantu penglihatan. Karena sering dipakai, kacamata dapat terkena debu, minyak, keringat, dan goresan. Jika tidak dirawat dengan baik, lensa maupun bingkai kacamata bisa cepat rusak.</p>
<p>Merawat kacamata sebenarnya tidak sulit. Dengan beberapa kebiasaan sederhana, kacamata dapat tetap bersih, nyaman digunakan, dan lebih awet. Berikut beberapa cara merawat kacamata dengan benar.</p>

<h2>1. Bersihkan Lensa Secara Rutin</h2>
<p>Lensa kacamata sebaiknya dibersihkan secara rutin, terutama ketika terlihat berdebu atau terdapat sidik jari. Gunakan air mengalir untuk membilas debu dan kotoran terlebih dahulu agar tidak menggores permukaan lensa.</p>
<p>Setelah itu, gunakan cairan pembersih khusus kacamata dan lap dengan kain microfiber yang bersih. Hindari menggosok lensa menggunakan tisu, pakaian, atau kain yang permukaannya kasar.</p>

<h2>2. Gunakan Kain Microfiber</h2>
<p>Kain microfiber dirancang untuk membersihkan permukaan lensa tanpa mudah meninggalkan goresan. Simpan kain tersebut di tempat yang bersih dan cuci secara berkala.</p>
<p>Hindari menggunakan kain yang sudah kotor karena debu atau partikel kecil yang menempel dapat menggores lensa saat digunakan untuk mengelap.</p>

<h2>3. Jangan Membersihkan Kacamata dalam Keadaan Kering Jika Berdebu</h2>
<p>Mengelap lensa yang dipenuhi debu secara langsung dapat menyebabkan partikel debu bergesekan dengan permukaan lensa. Sebaiknya bilas terlebih dahulu dengan air untuk menghilangkan debu, kemudian bersihkan menggunakan cairan khusus dan kain microfiber.</p>

<h2>4. Simpan Kacamata di Dalam Hard Case</h2>
<p>Ketika tidak digunakan, letakkan kacamata di dalam kotak atau hard case. Cara ini dapat melindungi kacamata dari benturan, debu, dan tekanan benda lain.</p>
<p>Sebaiknya jangan meletakkan kacamata sembarangan di atas meja atau di dalam tas tanpa pelindung. Jika harus meletakkannya di suatu tempat, pastikan lensa menghadap ke atas dan permukaannya aman dari benda-benda yang dapat menggores.</p>

<h2>5. Pegang Kacamata dengan Kedua Tangan</h2>
<p>Saat melepas atau memakai kacamata, biasakan memegang kedua sisi gagang dengan kedua tangan. Kebiasaan ini membantu menjaga keseimbangan bingkai sehingga tidak mudah berubah bentuk.</p>
<p>Menggunakan satu tangan secara terus-menerus dapat membuat salah satu sisi gagang lebih mudah longgar atau tidak sejajar.</p>

<h2>6. Hindari Meletakkan Kacamata di Tempat yang Terlalu Panas</h2>
<p>Paparan panas berlebihan dapat memengaruhi bahan tertentu pada lensa dan bingkai kacamata. Karena itu, hindari meninggalkan kacamata di dalam mobil yang terparkir di bawah sinar matahari atau di dekat sumber panas.</p>

<h2>7. Jangan Menggunakan Bahan Pembersih Sembarangan</h2>
<p>Tidak semua cairan pembersih aman untuk lensa kacamata. Hindari menggunakan bahan pembersih rumah tangga yang tidak diperuntukkan bagi lensa karena kandungannya dapat merusak lapisan pelindung tertentu.</p>
<p>Gunakan air dan cairan pembersih yang memang direkomendasikan untuk kacamata.</p>

<h2>8. Periksa Kondisi Kacamata Secara Berkala</h2>
<p>Selain membersihkan lensa, perhatikan kondisi bingkai, engsel, dan bantalan hidung. Jika sekrup mulai longgar atau posisi bingkai terasa tidak nyaman, sebaiknya lakukan penyetelan di optik.</p>
<p>Jangan memaksakan untuk membengkokkan bingkai sendiri karena dapat menyebabkan kerusakan.</p>

<h2>Kesimpulan</h2>
<p>Merawat kacamata dengan benar dapat dilakukan melalui kebiasaan sederhana, seperti membersihkan lensa secara rutin, menggunakan kain microfiber, menyimpan kacamata di dalam hard case, serta menghindarkannya dari panas dan bahan pembersih yang tidak sesuai. Dengan perawatan yang tepat, kacamata akan tetap bersih, nyaman digunakan, dan lebih tahan lama.</p>
`

excerpt:"Lensa yang kotor atau tergores mengganggu penglihatan. Ini sembilan tips sederhana agar lensa tetap jernih dan awet.",
html:`
<p>Lensa kacamata merupakan bagian penting yang perlu dirawat dengan baik. Lensa yang kotor, penuh noda, atau tergores dapat mengganggu kenyamanan saat melihat. Selain itu, kebiasaan membersihkan lensa dengan cara yang kurang tepat juga dapat menyebabkan permukaannya lebih cepat rusak.</p>
<p>Oleh karena itu, penting untuk mengetahui cara merawat lensa kacamata yang benar. Berikut beberapa tips sederhana yang bisa dilakukan sehari-hari.</p>

<h2>1. Bersihkan Lensa Secara Rutin</h2>
<p>Debu, minyak, dan keringat dapat menempel pada lensa selama kacamata digunakan. Bersihkan lensa secara rutin agar tetap jernih dan nyaman digunakan.</p>
<p>Sebelum membersihkan, bilas lensa dengan air bersih untuk membantu menghilangkan debu atau partikel kecil yang menempel. Setelah itu, gunakan cairan pembersih khusus kacamata dan lap dengan kain microfiber.</p>

<h2>2. Gunakan Kain Microfiber</h2>
<p>Kain microfiber merupakan pilihan yang tepat untuk membersihkan lensa kacamata. Teksturnya yang lembut membantu mengurangi risiko munculnya goresan pada permukaan lensa.</p>
<p>Pastikan kain yang digunakan dalam keadaan bersih. Kain yang sudah kotor atau mengandung debu justru dapat membuat lensa menjadi semakin kotor dan berisiko tergores.</p>

<h2>3. Hindari Mengelap Lensa dengan Sembarang Kain</h2>
<p>Hindari membersihkan lensa menggunakan ujung pakaian, tisu, handuk, atau kain yang memiliki permukaan kasar. Meskipun terlihat praktis, bahan-bahan tersebut dapat meninggalkan serat atau membuat permukaan lensa tergores.</p>
<p>Sebaiknya selalu sediakan kain microfiber khusus di dalam kotak kacamata.</p>

<h2>4. Jangan Mengelap Lensa yang Berdebu Secara Langsung</h2>
<p>Jika lensa terlihat berdebu, jangan langsung menggosoknya menggunakan kain. Partikel debu yang berada di permukaan lensa dapat bergesekan dengan lensa saat dilap.</p>
<p>Bilas terlebih dahulu dengan air bersih, kemudian bersihkan menggunakan cairan pembersih dan kain microfiber.</p>

<h2>5. Gunakan Cairan Pembersih Khusus Kacamata</h2>
<p>Untuk mendapatkan hasil pembersihan yang optimal, gunakan cairan yang memang dibuat untuk lensa kacamata. Hindari menggunakan cairan pembersih rumah tangga atau bahan lain yang tidak ditujukan untuk lensa.</p>
<p>Jika ragu mengenai produk pembersih yang aman, tanyakan kepada optik tempat Anda membeli kacamata.</p>

<h2>6. Simpan Kacamata dengan Benar</h2>
<p>Saat tidak digunakan, simpan kacamata di dalam hard case atau tempat kacamata. Cara ini membantu melindungi lensa dari debu, benturan, dan goresan.</p>
<p>Jangan meletakkan kacamata begitu saja di dalam tas karena dapat tertindih atau bergesekan dengan benda lain.</p>

<h2>7. Hindari Suhu yang Terlalu Panas</h2>
<p>Jangan meninggalkan kacamata di tempat dengan suhu sangat tinggi, seperti dashboard mobil yang terkena sinar matahari langsung. Panas berlebihan dapat memengaruhi beberapa jenis lensa maupun lapisan pada permukaannya.</p>
<p>Simpan kacamata di tempat yang sejuk dan terlindung ketika sedang tidak digunakan.</p>

<h2>8. Pegang Kacamata dengan Hati-Hati</h2>
<p>Saat membersihkan atau melepas kacamata, pegang bagian bingkai dengan hati-hati. Hindari terlalu sering menyentuh permukaan lensa menggunakan jari karena minyak dari tangan dapat meninggalkan noda.</p>
<p>Jika lensa terkena sidik jari, segera bersihkan menggunakan cara yang tepat.</p>

<h2>9. Periksa Kondisi Lensa Secara Berkala</h2>
<p>Perhatikan apakah terdapat goresan, perubahan lapisan, atau kerusakan pada lensa. Jika muncul masalah yang mengganggu penglihatan atau kenyamanan, sebaiknya periksakan kacamata ke optik.</p>
<p>Jangan mencoba menghilangkan goresan pada lensa menggunakan bahan atau metode rumahan yang tidak direkomendasikan.</p>

<p>Dengan perawatan yang tepat, lensa kacamata dapat tetap bersih, jernih, dan nyaman digunakan dalam aktivitas sehari-hari.</p>

  $("#fprod").textContent=prod?"Produk: "+prod:"";$("#fprod").hidden=!prod;
  frm.reset();frm.dataset.prod=prod||"";
  if(prod)frm.keperluan.value="Pembelian barang";
  dlg.showModal()}
frm.addEventListener("submit",e=>{
  e.preventDefault();const f=new FormData(frm),pr=frm.dataset.prod;
  const t=["Halo Yuiop, berikut data saya:","",
    "Nama: "+f.get("nama").trim(),
    "Usia: "+f.get("usia"),
    "Alamat: "+f.get("alamat").trim(),
    "Keperluan: "+f.get("keperluan")];
  if(pr)t.push("Produk: "+pr);
  window.open(wa(t.join("\n")),"_blank","noopener");
  dlg.close()});
$("#fcancel").onclick=()=>dlg.close();
$("#lb").addEventListener("click",()=>$("#lb").close());
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
$("#burger").onclick=()=>{const m=$("#menu");const o=m.classList.toggle("open");$("#burger").setAttribute("aria-expanded",o)};
$("#yr").textContent=new Date().getFullYear();
addEventListener("hashchange",render);render();
</script>
</body>
