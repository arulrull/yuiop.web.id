<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuiop Optik – Kacamata, Lensa & Softlens</title>
<meta name="description" content="Katalog frame kacamata, lensa, softlens, dan cairan pembersih lensa. Pesan mudah via WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#f5f6f7;--tx:#374151;--hd:#111827;--mut:#6b7280;--ac:#0f766e;--ach:#115e59;--line:#e5e7eb;--wa:#25d366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--bg2:#1a1f25;--tx:#cbd2da;--hd:#f3f4f6;--mut:#94a3b8;--ac:#2dd4bf;--ach:#5eead4;--line:#2a313a}}
:root[data-theme="dark"]{--bg:#111418;--bg2:#1a1f25;--tx:#cbd2da;--hd:#f3f4f6;--mut:#94a3b8;--ac:#2dd4bf;--ach:#5eead4;--line:#2a313a}
*{box-sizing:border-box}html{scroll-padding-top:5rem;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.w{max-width:1100px;margin:0 auto;padding:0 1rem}
h1,h2,h3{color:var(--hd);line-height:1.2;margin:0}
h2{font-size:1.6rem;margin-bottom:.4rem}
.sec{margin-top:5rem}.sub{color:var(--mut);margin:0 0 1.5rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:4rem}
.logo{font-weight:700;font-size:1.3rem;color:var(--ac)}
.menu{display:flex;align-items:center;gap:1.5rem;font-size:.9rem}
.menu a:hover{color:var(--ac)}.menu a[aria-current]{color:var(--ac);font-weight:600}.pt{font-size:2rem;margin-top:3rem}.cat{display:block}.tag{display:flex;gap:.75rem;flex-direction:column;padding:1.25rem;border-radius:16px;background:var(--bg2)}
#burger{display:none;border:1px solid var(--line);background:none;color:var(--tx);border-radius:12px;padding:.4rem .8rem;font:inherit}
.btn{display:inline-flex;justify-content:center;align-items:center;border-radius:16px;padding:.6rem 1.2rem;font-weight:600;font-size:.9rem;border:0;cursor:pointer;transition:.2s;font-family:inherit}
.b-ac{background:var(--ac);color:var(--bg)}.b-ac:hover{background:var(--ach)}
.b-wa{background:var(--wa);color:#fff}.b-wa:hover{filter:brightness(.93)}
.b-ln{background:var(--bg2);color:var(--tx)}.b-ln:hover{background:var(--line)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:center;padding:4rem 0 1rem}
.hero h1{font-size:2.8rem}.hero p{color:var(--mut);max-width:28rem;margin:1rem 0 2rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.ph{border-radius:16px;background:var(--bg2);aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;gap:1.5rem;grid-template-columns:repeat(4,1fr)}
.cats{display:grid;gap:1rem;grid-template-columns:repeat(4,1fr)}
.cat{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:1.5rem;font-weight:600;color:var(--hd);cursor:pointer;text-align:left;font:inherit;font-weight:600;transition:.2s}
.cat:hover{border-color:var(--ac);color:var(--ac)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.tab{border:0;border-radius:99px;padding:.4rem 1rem;background:var(--bg2);color:var(--mut);cursor:pointer;font:inherit;font-size:.85rem}
.tab.on{background:var(--ac);color:var(--bg)}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;transition:.2s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.card .ph{border-radius:0;box-shadow:none}
.cb{padding:1rem;display:flex;flex-direction:column;flex:1;gap:.25rem}
.k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ac);font-weight:600}
.cb .btn{margin-top:auto}.cb p{margin:0;font-size:.85rem;color:var(--mut)}
.vid{position:relative;cursor:pointer;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
.vid img,.vid iframe,.vid video{width:100%;height:100%;object-fit:cover;border:0}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{background:rgba(255,255,255,.9);color:#111;border-radius:50%;width:3rem;height:3rem;display:grid;place-items:center}
.g3{display:grid;gap:1.5rem;grid-template-columns:repeat(3,1fr)}
.g2{display:grid;gap:1.5rem;grid-template-columns:repeat(2,1fr)}
.meta{font-size:.8rem;color:var(--mut)}
.art{max-width:44rem;margin:2rem auto 0}.art h1{font-size:2.2rem;margin:.5rem 0}
.art .body h2{font-size:1.4rem;margin:1.8rem 0 .5rem}.art .body p,.art .body li{font-size:1.05rem}
.art .body a{color:var(--ac);text-decoration:underline}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;margin-top:2rem}
table{border-collapse:collapse;width:100%;margin:1rem 0}td{padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.9rem}td:first-child{color:var(--mut);width:40%}
.price{font-size:1.5rem;font-weight:700;color:var(--hd)}
.pg{display:flex;gap:.5rem;justify-content:center;margin-top:2rem}
.map{border:0;width:100%;height:16rem;border-radius:16px;background:var(--bg2)}
footer{margin-top:6rem;background:var(--bg2);border-top:1px solid var(--line);padding:2rem 0;font-size:.85rem;color:var(--mut)}
.fab{position:fixed;right:1.2rem;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:99px;padding:.75rem 1.3rem}
@media(max-width:860px){.hero,.pd{grid-template-columns:1fr}.hero h1{font-size:2.1rem}.grid,.cats{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
#burger{display:block}.menu{display:none;position:absolute;left:0;right:0;top:4rem;background:var(--bg);flex-direction:column;align-items:stretch;padding:1rem;gap:.5rem;border-bottom:1px solid var(--line)}.menu.open{display:flex}}
</style>
</head>
<body>
<header><nav class="w">
<a class="logo" href="#/">Yuiop</a>
<button id="burger" aria-label="Buka menu" aria-expanded="false">Menu</button>
<div class="menu" id="menu">
<a href="#/">Beranda</a><a href="#/produk">Produk</a><a href="#/blog">Blog</a><a href="#/kontak">Kontak</a>
<a class="btn b-wa wal" target="_blank" rel="noopener noreferrer">Chat WhatsApp</a>
</div></nav></header>
<main id="app" class="w"></main>
<footer><div class="w">© <span id="yr"></span> Yuiop Optik. Semua hak dilindungi.</div></footer>
<a class="btn b-wa fab wal" target="_blank" rel="noopener noreferrer" aria-label="Chat WhatsApp">WhatsApp</a>

<script>
/* =====================================================================
   PANDUAN ASET (gambar & video)
   1. Buat folder "aset" di sebelah file HTML ini, lalu isi sesuai nama di bawah:
        aset/hero.jpg                  -> gambar beranda
        aset/produk/<slug-produk>.jpg  -> foto produk (bisa tambah foto lain di daftar)
        aset/video/<id>.jpg            -> thumbnail video
        aset/video/<nama>.mp4          -> video lokal (atur di daftar V)
        aset/blog/<slug-artikel>.jpg   -> sampul artikel
   2. Ubah nama file di ASET di bawah jika berbeda. Boleh juga isi URL penuh (https://...).
   3. File yang belum ada otomatis diganti gambar placeholder.
   4. Video YouTube: isi ID video (bagian setelah v=) pada kolom "src" di daftar V.
   ===================================================================== */
const TOKO={
  wa:"6281234567890",            // nomor WhatsApp, format 628xxxxxxxxxx
  alamat:"Jl. Contoh No. 123, Surakarta",
  jam:"Senin–Sabtu 09.00–20.00",
  instagram:"@yuiop.optik",
  maps:"Surakarta"               // kata kunci lokasi untuk Google Maps
};
const WA=TOKO.wa;
const ASET={
  hero:"aset/yo.jpg",
  produk:{
  "frame-classic-round":["aset/f8.jpg"],
  "frame-slim-square":["aset/f4.jpg"],
  "frame-titanium-light":["aset/frame dior 1.jpg"],
  "lensa-blue-light":["aset/l9.jpg"],
  "lensa-photochromic":["aset/l7.jpg"],
  "lensa-progresif":["aset/l2.jpg"],
  "softlens-harian":["aset/sl6.jpg"],
  "softlens-bulanan":["aset/sl6.jpg"],
  "softlens-warna":["aset/l14.jpg"],
  "cairan-pembersih-lensa-60ml":["aset/pl12.jpg"],
  "multipurpose-solution-120ml":["aset/psl10.jpg"],
  "lens-cleaning-kit":["aset/pl15.jpg"]
  },
  blog:{
  "cara-memilih-frame-sesuai-bentuk-wajah":"aset/blog/cara-memilih-frame-sesuai-bentuk-wajah.jpg",
  "tips-merawat-lensa-kacamata":"aset/blog/tips-merawat-lensa-kacamata.jpg",
  "softlens-atau-kacamata":"aset/blog/softlens-atau-kacamata.jpg"
  }
};
const wa=m=>`https://wa.me/${WA}?text=${encodeURIComponent(m)}`;
const GEN="Halo Yuiop, saya ingin konsultasi kacamata.";
const CAT={frame:"Frame Kacamata",lensa:"Lensa Kacamata",softlens:"Softlens",cairan:"Cairan Pembersih Lensa"};
const gp=p=>ASET.produk[p.slug]||[];
const img=(src,alt,cls,extra)=>`<img class="${cls||""}" src="${src||PH}" alt="${alt}" ${extra||""} onerror="this.onerror=null;this.src=PH">`;
const rp=n=>"Rp "+n.toLocaleString("id-ID");
const PH="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#e5e7eb"/><g fill="none" stroke="#9ca3af" stroke-width="6"><circle cx="150" cy="150" r="45"/><circle cx="250" cy="150" r="45"/><path d="M195 150h10"/></g></svg>');
const raw={
frame:[["Frame Classic Round",250000,"Bingkai bulat ringan untuk pemakaian harian.","Acetate"],["Frame Slim Square",300000,"Bingkai persegi tipis, tampilan profesional.","Metal"],["Frame Titanium Light",550000,"Titanium super ringan dan tahan karat.","Titanium"]],
lensa:[["Lensa Blue Light",200000,"Filter cahaya biru dari layar gadget.","Indeks 1.56"],["Lensa Photochromic",350000,"Gelap otomatis saat di luar ruangan.","Indeks 1.56"],["Lensa Progresif",600000,"Satu lensa untuk semua jarak pandang.","Indeks 1.60"]],
softlens:[["Softlens Harian",60000,"Sekali pakai, praktis dan higienis.","1 hari"],["Softlens Bulanan",90000,"Nyaman dipakai hingga sebulan.","30 hari"],["Softlens Warna",120000,"Pilihan warna natural untuk gaya harian.","30 hari"]],
cairan:[["Cairan Pembersih Lensa 60ml",15000,"Bebas noda dan sidik jari.","60 ml"],["Multipurpose Solution 120ml",45000,"All-in-one untuk softlens.","120 ml"],["Lens Cleaning Kit",35000,"Cairan, kain mikrofiber, dan pouch.","Set"]]};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const P=[];let i=0;for(const k in raw)raw[k].forEach((r,n)=>P.push({id:++i,slug:slug(r[0]),nama:r[0],kat:k,harga:r[1],desc:r[2],spek:[["Kategori",CAT[k]],["Bahan / Ukuran",r[3]],["Garansi","Sesuai ketentuan toko"]],vid:n==0?"v"+(i<4?1:i<7?2:i<10?3:4):null}));
const V=[{id:"v1",t:"Memilih Frame yang Cocok",tp:"youtube",src:"dQw4w9WgXcQ",p:"frame-classic-round"},{id:"v2",t:"Mengenal Lensa Blue Light",tp:"youtube",src:"dQw4w9WgXcQ",p:"lensa-blue-light"},{id:"v3",t:"Cara Memakai Softlens",tp:"local",src:"aset/video/softlens.mp4",p:"softlens-harian"},{id:"v4",t:"Merawat Lensa dengan Benar",tp:"local",src:"aset/video/cairan.mp4"}];
const POSTS=[
{slug:"cara-memilih-frame-sesuai-bentuk-wajah",title:"Cara Memilih Frame Sesuai Bentuk Wajah",date:"2026-09-20",read:3,excerpt:"Bentuk wajah menentukan frame yang paling serasi. Ini panduan singkatnya.",html:"<p>Memilih frame bukan hanya soal tren, tetapi juga kenyamanan dan keserasian dengan wajah Anda.</p><h2>Wajah bulat</h2><p>Pilih frame persegi atau kotak untuk memberi kesan tegas.</p><h2>Wajah persegi</h2><p>Frame bulat atau oval akan melembutkan garis rahang.</p><h2>Wajah oval</h2><p>Hampir semua bentuk cocok; pilih sesuai selera dan aktivitas.</p>"},
{slug:"tips-merawat-lensa-kacamata",title:"5 Tips Merawat Lensa Kacamata",date:"2026-09-12",read:2,excerpt:"Lensa yang terawat lebih awet dan nyaman. Simak lima kebiasaan sederhana ini.",html:"<p>Lensa yang bersih membuat pandangan lebih jelas dan mata tidak cepat lelah.</p><ul><li>Bilas dengan air sebelum diusap.</li><li>Gunakan kain mikrofiber.</li><li>Hindari tisu kasar atau ujung baju.</li><li>Simpan di case saat tidak dipakai.</li><li>Jangan letakkan lensa menghadap ke bawah.</li></ul>"},
{slug:"softlens-atau-kacamata",title:"Softlens atau Kacamata: Mana yang Cocok?",date:"2026-09-03",read:4,excerpt:"Keduanya punya kelebihan. Kenali perbedaannya sebelum memutuskan.",html:"<p>Kacamata praktis dan minim perawatan, sedangkan softlens memberi kebebasan gerak dan penampilan natural.</p><h2>Pertimbangkan gaya hidup</h2><p>Aktif berolahraga? Softlens bisa jadi pilihan. Banyak di depan layar? Kacamata dengan filter blue light membantu.</p><p>Masih ragu? <a href=\"#/kontak\">Konsultasikan dengan kami</a>.</p>"}];
const fd=d=>new Date(d).toLocaleDateString("id-ID",{dateStyle:"long"});
const $=s=>document.querySelector(s),app=$("#app");
let cat=null,pending=null;

const pcard=p=>`<article class="card"><a href="#/produk/${p.slug}">${img(gp(p)[0],p.nama,"ph",'loading="lazy"')}</a><div class="cb"><span class="k">${CAT[p.kat]}</span><h3><a href="#/produk/${p.slug}">${p.nama}</a></h3><p>Mulai dari ${rp(p.harga)}</p><a class="btn b-wa" style="margin-top:.8rem" target="_blank" rel="noopener noreferrer" href="${wa(`Halo Yuiop, saya tertarik dengan ${p.nama} (${CAT[p.kat]}). Apakah masih tersedia?`)}">Pesan via WhatsApp</a></div></article>`;
const vcard=v=>`<div><div class="vid" data-v="${v.id}" role="button" tabindex="0" aria-label="Putar ${v.t}">${img(ASET.video[v.id],v.t,"",'loading="lazy"')}<div class="play"><span>▶</span></div></div><p style="margin:.5rem 0 0;font-weight:600;color:var(--hd)">${v.t}</p>${v.p?`<a class="meta" style="color:var(--ac)" href="#/produk/${v.p}">Lihat produk →</a>`:""}</div>`;
const postc=p=>`<a class="card" href="#/blog/${p.slug}">${img(ASET.blog[p.slug],"Sampul "+p.title,"ph",'loading="lazy"')}<div class="cb"><span class="meta">${fd(p.date)} · ${p.read} menit baca</span><h3>${p.title}</h3><p>${p.excerpt}</p></div></a>`;
const list=()=>(cat?P.filter(p=>p.kat==cat):P).map(pcard).join("");
const tabs=()=>[[null,"Semua"],...Object.entries(CAT)].map(([k,l])=>`<button class="tab${cat==k?" on":""}" data-c="${k}">${l}</button>`).join("");

function home(){const ft=Object.keys(CAT).map(k=>P.find(p=>p.kat==k));return `
<section class="hero"><div><h1>Lihat lebih jelas, tampil lebih percaya diri.</h1><p>Frame, lensa, softlens, dan perawatan lensa pilihan dari Yuiop. Konsultasi dan pesan langsung lewat WhatsApp.</p><div class="row"><a class="btn b-ac" href="#/produk" data-c="null">Lihat Produk</a><a class="btn b-wa wal" target="_blank" rel="noopener noreferrer">Chat WhatsApp</a></div></div>${img(ASET.hero,"Kacamata koleksi Yuiop","ph")}</section>
<section class="sec"><h2>Kategori Produk</h2><p class="sub">Pilih kategori untuk langsung melihat produknya.</p><div class="cats">${Object.entries(CAT).map(([k,l])=>`<a class="cat" href="#/produk" data-c="${k}">${l}</a>`).join("")}</div></section>
<section class="sec"><h2>Produk Unggulan</h2><p class="sub">Pilihan favorit dari tiap kategori.</p><div class="grid">${ft.map(pcard).join("")}</div><p style="margin-top:1.5rem"><a class="btn b-ln" href="#/produk" data-c="null">Lihat semua produk →</a></p></section>
<section class="sec"><h2>Artikel Terbaru</h2><p class="sub">Tips dan panduan seputar kacamata.</p><div class="g3">${POSTS.slice(0,3).map(postc).join("")}</div><p style="margin-top:1.5rem"><a class="btn b-ln" href="#/blog">Lihat semua artikel →</a></p></section>
<section class="sec" style="text-align:center;padding:2.5rem 1rem;border-radius:16px;background:var(--bg2)"><h2>Bingung memilih?</h2><p class="sub">Ceritakan kebutuhan Anda, tim kami bantu carikan yang paling cocok.</p><a class="btn b-wa wal" target="_blank" rel="noopener noreferrer">Konsultasi via WhatsApp</a></section>`}

const produkPage=()=>`<h1 class="pt">Produk</h1><p class="sub">Semua produk Yuiop. Harga mulai dari; hubungi kami untuk detail dan ketersediaan.</p><div class="tabs" id="tabs">${tabs()}</div><div class="grid" id="plist">${list()}</div>`;
const kontakPage=()=>`<h1 class="pt">Tentang & Kontak</h1><p class="sub" style="max-width:38rem">Yuiop Optik melayani konsultasi dan penjualan perlengkapan kacamata: frame, lensa, softlens, hingga perawatan lensa.</p>
<div class="g3" style="margin-bottom:3rem"><div class="tag"><h3>Produk pilihan</h3><span class="meta">Frame, lensa, dan softlens yang kami seleksi untuk kenyamanan harian.</span></div><div class="tag"><h3>Konsultasi ramah</h3><span class="meta">Tanya dulu lewat WhatsApp, tanpa kewajiban membeli.</span></div><div class="tag"><h3>Pesan mudah</h3><span class="meta">Klik tombol WhatsApp di produk, pesan otomatis terisi.</span></div></div>
<div class="g2"><div><table><tr><td>Alamat</td><td>${TOKO.alamat}</td></tr><tr><td>Jam buka</td><td>${TOKO.jam}</td></tr><tr><td>WhatsApp</td><td>+${WA}</td></tr><tr><td>Instagram</td><td>${TOKO.instagram}</td></tr></table><a class="btn b-wa wal" target="_blank" rel="noopener noreferrer">Chat WhatsApp</a></div><iframe class="map" title="Lokasi Yuiop" loading="lazy" src="https://www.google.com/maps?q=${encodeURIComponent(TOKO.maps)}&output=embed"></iframe></div>`;

function detail(s){const p=P.find(x=>x.slug==s);if(!p)return nf();const v=V.find(x=>x.p==p.slug);
return `<div class="pd"><div style="display:grid;gap:1rem;align-content:start">${(gp(p).length?gp(p):[""]).map((g,i)=>img(g,p.nama+" foto "+(i+1),"ph")).join("")}</div><div><span class="k">${CAT[p.kat]}</span><h1 style="font-size:2rem;margin:.3rem 0 1rem">${p.nama}</h1><p>${p.desc}</p><p class="meta" style="margin:1.2rem 0 0">Mulai dari</p><div class="price">${rp(p.harga)}</div><table>${p.spek.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><a class="btn b-wa" style="width:100%;padding:.9rem" target="_blank" rel="noopener noreferrer" href="${wa(`Halo Yuiop, saya tertarik dengan ${p.nama} (${CAT[p.kat]}). Apakah masih tersedia?`)}">Pesan via WhatsApp</a></div></div>${v?`<section class="sec"><h2>Video Produk</h2><div style="max-width:32rem">${vcard(v)}</div></section>`:""}<p style="margin-top:2rem"><a class="btn b-ln" href="#/produk">← Kembali</a></p>`}

function blog(pg){const n=6,tot=Math.ceil(POSTS.length/n),c=Math.min(Math.max(+pg||1,1),tot);const s=[...POSTS].sort((a,b)=>b.date.localeCompare(a.date)).slice((c-1)*n,c*n);
return `<h1 style="margin-top:3rem;font-size:2rem">Blog</h1><p class="sub">Tips dan panduan seputar kacamata.</p><div class="g3">${s.map(postc).join("")}</div>${tot>1?`<div class="pg">${Array.from({length:tot},(_,i)=>`<a class="btn ${i+1==c?"b-ac":"b-ln"}" href="#/blog/hal/${i+1}">${i+1}</a>`).join("")}</div>`:""}`}

function post(s){const p=POSTS.find(x=>x.slug==s);if(!p)return nf();document.title=p.title+" | Yuiop Optik";
const url=location.href;return `<article class="art"><a class="meta" href="#/blog">← Semua artikel</a><h1>${p.title}</h1><p class="meta">${fd(p.date)} · ${p.read} menit baca</p>${img(ASET.blog[p.slug],"Sampul "+p.title,"ph",'style="margin:1.5rem 0"')}<div class="body">${p.html}</div><div class="row" style="margin-top:2rem"><a class="btn b-wa" target="_blank" rel="noopener noreferrer" href="${wa(p.title+" "+url)}">Bagikan ke WhatsApp</a><button class="btn b-ln" id="copy">Salin link</button></div><div style="margin-top:2.5rem;padding:1.5rem;border-radius:16px;background:var(--bg2)"><h3>Butuh saran soal kacamata?</h3><p>Tim kami siap membantu Anda memilih.</p><a class="btn b-wa wal" target="_blank" rel="noopener noreferrer">Konsultasi via WhatsApp</a></div></article>`}
const nf=()=>`<h1 style="margin-top:4rem">Halaman tidak ditemukan</h1><p><a class="btn b-ac" href="#/">Ke beranda</a></p>`;

function render(){const h=location.hash.replace(/^#\/?/,"").split("/");document.title=({produk:"Produk",video:"Video",blog:"Blog",kontak:"Kontak"}[h[0]]?({produk:"Produk",video:"Video",blog:"Blog",kontak:"Kontak"}[h[0]])+" | Yuiop Optik":"Yuiop Optik – Kacamata, Lensa & Softlens");
app.innerHTML=h[0]=="produk"?(h[1]?detail(h[1]):produkPage()):h[0]=="video"?videoPage():h[0]=="kontak"?kontakPage():h[0]=="blog"?(h[1]=="hal"?blog(h[2]):h[1]?post(h[1]):blog(1)):home();
document.querySelectorAll(".wal").forEach(a=>a.href=wa(GEN));
document.querySelectorAll(".menu a:not(.btn)").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")=="#/"+(h[0]||"")));
$("#menu").classList.remove("open");
if(pending){go(pending);pending=null}else if(!h[0]||h[0]=="")window.scrollTo(0,0);else window.scrollTo(0,0)}
function go(id){if(id=="top")return window.scrollTo({top:0,behavior:"smooth"});const e=document.getElementById(id);e&&e.scrollIntoView({behavior:"smooth"})}
const isHome=()=>!location.hash.replace(/^#\/?/,"");

document.addEventListener("click",e=>{
const c=e.target.closest("[data-c]");if(c){cat=c.dataset.c=="null"?null:c.dataset.c;const l=$("#plist");if(l){l.innerHTML=list();$("#tabs").innerHTML=tabs()}}
const s=e.target.closest("[data-s]");if(s){e.preventDefault();if(isHome())go(s.dataset.s);else{pending=s.dataset.s;location.hash="#/"}$("#menu").classList.remove("open")}
const v=e.target.closest("[data-v]");if(v&&!v.querySelector("iframe,video")){const x=V.find(y=>y.id==v.dataset.v);v.innerHTML=x.tp=="youtube"?`<iframe src="https://www.youtube-nocookie.com/embed/${x.src}?autoplay=1" title="${x.t}" allow="autoplay;encrypted-media" allowfullscreen></iframe>`:`<video src="${x.src}" controls autoplay></video>`}
if(e.target.id=="copy"){try{navigator.clipboard.writeText(location.href);e.target.textContent="Tersalin ✓"}catch(_){e.target.textContent="Salin manual dari address bar"}}});
document.addEventListener("keydown",e=>{if((e.key=="Enter"||e.key==" ")&&e.target.dataset&&e.target.dataset.v){e.preventDefault();e.target.click()}});
$("#burger").onclick=()=>{const m=$("#menu");const o=m.classList.toggle("open");$("#burger").setAttribute("aria-expanded",o)};
$("#yr").textContent=new Date().getFullYear();
addEventListener("hashchange",render);render();
</script>
</body>
</html>
